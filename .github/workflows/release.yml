name: Release

# 打 tag（v2.7 这种）时自动构建公版 APK 并挂到 Release 上，
# 免掉"本地构建 → 打开网页 → 手动上传"这一步。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create or update"
        required: true
        default: ""

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    # 没有配置签名 secret 时直接跳过，避免在这个仓库上跑出未签名的假产物。
    if: ${{ github.event_name == 'workflow_dispatch' || vars.RELEASE_SIGNING_READY == '1' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Android platform / build-tools
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -f "$SDK/platforms/android-36/android.jar" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36"
          fi

      - name: 还原签名文件
        run: |
          mkdir -p phone/libs
          echo "${{ secrets.PROXY_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          curl -sSL -o phone/libs/libv2ray.aar \
            https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.11.9/libv2ray.aar
          echo "cdfef146218233a31a8b52c8b1016557730d3b63fc121d4c84cacea50e669155  phone/libs/libv2ray.aar" | sha256sum -c -

      - name: 构建公版（0 节点）
        env:
          PROXY_RELEASE: "1"
          PROXY_KEYSTORE: ${{ runner.temp }}/release.keystore
          PROXY_KS_ALIAS: ${{ vars.PROXY_KS_ALIAS }}
          PROXY_KS_PASS: ${{ secrets.PROXY_KS_PASS }}
        run: |
          echo '[]' > "$RUNNER_TEMP/empty-nodes.json"
          PROXY_NODES_JSON="$RUNNER_TEMP/empty-nodes.json" \
            PROXY_APK_OUT="$PWD/dist/手机代理-公版.apk" \
            python phone/build_apk.py --public
          sha256sum "dist/手机代理-公版.apk" | tee dist/SHA256SUMS.txt

      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}"
          test -n "$TAG" || { echo "release_tag is required"; exit 1; }
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --generate-notes --repo "$GITHUB_REPOSITORY"
          gh release upload "$TAG" "dist/手机代理-公版.apk" dist/SHA256SUMS.txt \
            --clobber --repo "$GITHUB_REPOSITORY"
