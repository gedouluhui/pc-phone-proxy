name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: "17"

      - name: CI Action / 二进制供应链 pin
        run: python tools/check_ci_supply_chain.py

      - name: 语法检查（pc/_proxy）
        run: python -m compileall -q pc/_proxy

      # 与用户便携版同版本的真 sing-box：tests_ci/test_singbox_configs.py 用它校验
      # TUN / 深测 / 延迟测三套生成配置（含 Hysteria2），生成器出错会在这里拦下，
      # 而不是在用户机器上重建隧道时断网。
      - name: 取 sing-box 1.14.4（与便携版一致）
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "sb.zip"
          Invoke-WebRequest -Uri "https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-windows-amd64.zip" -OutFile $zip
          $expected = "99185d75d314a07dbba4a130c8ad986cbeb629a07927975636b341ca61f991df"
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "sing-box SHA-256 mismatch: $actual" }
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP "sb")
          $exe = Get-ChildItem -Recurse (Join-Path $env:RUNNER_TEMP "sb") -Filter sing-box.exe | Select-Object -First 1
          & $exe.FullName version
          "SINGBOX_BIN=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: PC 回归（PAC / SSRF / 发布闸门 / 脱敏）
        run: python tools/run_ci_tests.py

      - name: 将 PC 回归失败日志转成注解
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path _ci_test_output.log) {
            $lines = Get-Content _ci_test_output.log
            $hits = @($lines | Select-String -Pattern '^(FAIL|ERROR):|Traceback|AssertionError|ResourceWarning')
            if ($hits.Count -eq 0) { $hits = @($lines | Select-Object -Last 20) }
            $hits | Select-Object -First 50 | ForEach-Object {
              $safe = $_.ToString().Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              "::error::$safe"
            }
          }

      - name: 上传 PC 回归日志
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pc-regression-log
          path: _ci_test_output.log
          if-no-files-found: warn
          retention-days: 7

      - name: 订阅地址护栏 PoC（JDK）
        run: python phone/tests/run_guard_poc.py

      - name: DNS 固定订阅传输 PoC（HTTP / TLS）
        run: python phone/tests/run_http_poc.py

      - name: Keystore AES/GCM 信封 PoC（JDK）
        run: python phone/tests/run_secure_envelope_poc.py

      - name: VPN 取消 / 会话 / 网络去抖 PoC（JDK）
        run: python phone/tests/run_lifecycle_poc.py

      - name: 发布前防泄漏自检
        run: python phone/check_release.py

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: "17"

      # 不用 android-actions/setup-android：它内部会执行 `sdkmanager tools`，
      # 而新版 SDK 布局里已经没有这个包，v3 会直接失败。runner 自带 SDK，
      # 缺 platform 时用 sdkmanager 单独补。
      - name: 安装 platform（缺才装）
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          if [ ! -f "$SDK/platforms/android-36/android.jar" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36"
          fi

      - name: 取 libv2ray.aar（二进制不入库，用上游固定版本）
        run: |
          mkdir -p /tmp/lv /tmp/classes
          curl -sSL -o /tmp/libv2ray.aar \
            https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.11.9/libv2ray.aar
          echo "cdfef146218233a31a8b52c8b1016557730d3b63fc121d4c84cacea50e669155  /tmp/libv2ray.aar" | sha256sum -c -
          unzip -o -q /tmp/libv2ray.aar classes.jar -d /tmp/lv

      - name: Java 编译检查（javac）
        run: |
          javac -encoding UTF-8 -source 8 -target 8 -Xlint:-options \
            -classpath "$ANDROID_HOME/platforms/android-36/android.jar:/tmp/lv/classes.jar" \
            -d /tmp/classes $(find phone/src -name '*.java')
          echo "javac OK: $(find /tmp/classes -name '*.class' | wc -l) classes"

      - name: 缓存 Xray / org.json（按固定版本）
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: phone/tools/.cache
          key: poison-${{ runner.os }}-xray-v26.11.9-json-20240303

      # 解析器与真内核的闭环：333 条投毒样本 + 每条被接受节点过 `xray run -test`
      # + fullConfig 与 golden 比对。任何解析规则与内核漂移都会在这里失败。
      - name: 投毒语料闭环（纯 JVM 解析器 ↔ Xray）
        run: python3 phone/tools/check_poison.py

      - name: 源清单 RSA 签名与版本 schema（OpenSSL / JVM）
        run: |
          python3 tools/verify_sources.py
          python3 phone/tests/run_manifest_poc.py

      # 只做 javac 挡不住 aapt2/d8/Manifest 这类打包期错误（specialUse 属性、
      # dataExtractionRules 都只有真正打包时才会被校验）。这里用临时 debug 签名
      # 完整跑一遍 build_apk.py。
      - name: 完整打包（debug 签名）
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$BT" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;36.0.0" > /dev/null
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          fi
          keytool -genkeypair -keystore /tmp/ci.keystore -alias ci -storepass android \
            -keypass android -dname "CN=CI" -keyalg RSA -keysize 2048 -validity 3650 \
            > /dev/null 2>&1
          # build_apk.py 要求 phone/libs/libv2ray.aar 存在（二进制不入库），
          # 复用上一步下载到 /tmp 的那份。
          mkdir -p phone/libs
          cp /tmp/libv2ray.aar phone/libs/libv2ray.aar
          echo '[]' > /tmp/empty-nodes.json
          PROXY_KEYSTORE=/tmp/ci.keystore PROXY_KS_ALIAS=ci PROXY_KS_PASS=android \
            PROXY_NODES_JSON=/tmp/empty-nodes.json PROXY_APK_OUT=/tmp/ci.apk \
            python3 phone/build_apk.py
          test -s /tmp/ci.apk && echo "APK built: $(stat -c %s /tmp/ci.apk) bytes"

      - name: 生成 CycloneDX SBOM 与 SLSA 来源证明
        run: |
          python3 tools/generate_sbom.py --components tools/release_components.json --output /tmp/sbom.cdx.json
          python3 tools/generate_provenance.py \
            --repository "https://github.com/${GITHUB_REPOSITORY}" \
            --commit "${GITHUB_SHA}" \
            --builder "https://github.com/actions/runner" \
            --material /tmp/libv2ray.aar \
            --material phone/sources.json \
            --artifact /tmp/ci.apk \
            --output /tmp/provenance.json

      - name: 上传 SBOM / provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-sbom-provenance
          path: |
            /tmp/sbom.cdx.json
            /tmp/provenance.json
          if-no-files-found: error
          retention-days: 30
